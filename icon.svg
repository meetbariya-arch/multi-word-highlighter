<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>
  </defs>

  <!-- yellow highlighter swipe behind the glass -->
  <rect x="14" y="86" width="72" height="16" rx="4" fill="#FFD400" transform="rotate(-8 50 94)"/>

  <!-- magnifying glass -->
  <circle cx="54" cy="52" r="34" fill="#FFFFFF" stroke="url(#glassGrad)" stroke-width="9"/>
  <circle cx="54" cy="52" r="34" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>

  <!-- highlighted word marks inside the lens -->
  <rect x="34" y="42" width="40" height="9" rx="2" fill="#FFD400"/>
  <rect x="34" y="58" width="26" height="9" rx="2" fill="#FFD400"/>

  <!-- handle -->
  <rect x="86" y="80" width="16" height="42" rx="8" fill="url(#glassGrad)" transform="rotate(45 94 101)"/>
</svg>
