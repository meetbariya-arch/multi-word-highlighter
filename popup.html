<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root{
    --ink:#1A202C;
    --yellow:#FFD400;
    --gray:#4A5568;
  }
  body{
    width: 280px;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 14px;
    background: #fff;
    color: var(--ink);
  }
  h1{
    font-size: 14px;
    margin: 0 0 10px 0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  h1 img{ width:20px; height:20px; }
  textarea{
    width: 100%;
    box-sizing: border-box;
    height: 60px;
    resize: vertical;
    padding: 8px;
    border: 1px solid #CBD5E0;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
  }
  .row{
    display:flex;
    gap:8px;
    margin-top: 10px;
  }
  button{
    flex:1;
    padding: 8px 10px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #highlightBtn{
    background: var(--yellow);
    color: var(--ink);
  }
  #highlightBtn:hover{ filter: brightness(0.95); }
  #clearBtn{
    background: #EDF2F7;
    color: var(--ink);
  }
  #clearBtn:hover{ background: #E2E8F0; }
  .hint{
    font-size: 11px;
    color: #718096;
    margin-top: 8px;
    line-height: 1.4;
  }
  #status{
    font-size: 12px;
    margin-top: 8px;
    min-height: 14px;
    color: var(--gray);
  }
  #termBreakdown{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .term-chip{
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: 600;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .term-chip.matched{
    background: #dcfce7;
    color: #15803d;
  }
  .term-chip.unmatched{
    background: #fee2e2;
    color: #b91c1c;
  }
</style>
</head>
<body>
  <h1><img src="icons/icon32.png" alt=""> Multi-Word Highlighter</h1>
  <textarea id="words" placeholder='e.g. invoice, pending  OR  "Freight Forwarding" | "Customs Compliance"'></textarea>
  <div class="row">
    <button id="highlightBtn">Highlight</button>
    <button id="clearBtn">Clear</button>
  </div>
  <div id="status"></div>
  <div id="termBreakdown"></div>
  <div class="hint">Works with comma, pipe ( | ), middle-dot ( · ), quoted phrases, or one term per line. Only touches visible text — never page scripts, links, or editors. Also highlights content that loads in later (AJAX/SPA).</div>
  <script src="popup.js"></script>
</body>
</html>
